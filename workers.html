<section class="listing-head"><span class="eyebrow">Local worker directory</span><h1>Find the right household helper.</h1><p>Search by area and service, then open a profile to contact a worker.</p></section>
<section class="filter-wrap"><form id="filters" class="filters"><input id="area" placeholder="Area e.g. Kothrud"><select id="service"><option value="">All services</option><option>House Maid</option><option>Cleaning</option><option>Dish Washing</option><option>Cooking</option><option>Babysitter</option><option>Elder Care</option></select><select id="availability"><option value="">Any time</option><option>Morning</option><option>Evening</option><option>Full Time</option></select><button>Search</button></form></section>
<section class="section"><div class="results-row"><h2 id="count">Workers</h2><button id="clear" class="text-btn">Clear</button></div><div class="worker-grid" id="workerGrid"></div><div id="empty" class="empty hidden">No workers found. Try another area or service.</div></section>
