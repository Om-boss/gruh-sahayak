<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Worker | Gruh Sahayak</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="navbar"><a class="brand" href="index.html">🏠 Gruh <b>Sahayak</b></a><nav class="nav-links"><a href="index.html">Home</a><a href="workers.html">Find Workers</a></nav></header>
<main class="form-page"><div class="form-card"><span class="eyebrow">Join Gruh Sahayak</span><h1>Register as a worker</h1><p>Demo form for the frontend stage. Database submission comes later.</p>
<form id="register" class="register-form"><input required placeholder="Full name"><input required type="tel" placeholder="Phone number"><input required placeholder="Area / locality"><select required><option value="">Select service</option><option>House Maid</option><option>Cleaning</option><option>Dish Washing</option><option>Cooking</option><option>Babysitter</option><option>Elder Care</option></select><input required placeholder="Years of experience"><textarea rows="4" placeholder="Tell families about your services"></textarea><button>Submit Registration</button></form><p id="msg" class="success hidden">Registration received in this demo.</p></div></main>
<script>document.getElementById('register').onsubmit=e=>{e.preventDefault();e.target.classList.add('hidden');document.getElementById('msg').classList.remove('hidden')}</script></body></html>
